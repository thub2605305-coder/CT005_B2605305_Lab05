<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic - Nhiệm vụ 2.2</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 10px #bbb;
        }

        h1 {
            color: #1565c0;
        }

        .description {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .infographic {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .video {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-top: 25px;
        }

        .video iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border: 0;
            border-radius: 8px;
        }

        footer {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Infographic và Video Nhiệm vụ 2.2</h1>

        <p class="description">
            Infographic minh họa nội dung bài học và video hướng dẫn thực hiện
            Nhiệm vụ 2.2.
        </p>

        <img
            class="infographic"
            src="Lab05_Ex2.1.png"
            alt="Infographic Nhiệm vụ 2.1"
        >

        <div class="video">
            <iframe
                src="https://www.youtube.com/embed/KqfMUl2JFT4"
                title="Video hướng dẫn Nhiệm vụ 2.2"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <footer>
            © 2026 CT005 - Lab 05. Infographic thuộc tài liệu bài tập.
            Video được nhúng từ YouTube.
        </footer>
    </main>
</body>
</html>
